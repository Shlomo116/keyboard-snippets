<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>קיצורי הקלדה</title>
  <style>
    :root {
      --bg:#fff; --ink:#171a24; --muted:#6b7280; --line:rgba(15,18,40,.11);
      --brand:#4353d6; --brand-soft:#eef1ff; --chip:#f1f3f9;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1e2029; --ink:#e9ebf2; --muted:#9aa1b6; --line:rgba(255,255,255,.12);
              --brand:#a5b4ff; --brand-soft:#2b3050; --chip:#282b37; }
    }
    * { box-sizing: border-box; }
    body {
      width: 330px; margin: 0; padding: 15px; background: var(--bg); color: var(--ink);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Rubik, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
    .logo {
      display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px;
      background: linear-gradient(140deg,#4353d6,#6f7ef0); color: #fff; font-weight: 800; font-size: 12px;
    }
    h1 { margin: 0; font-size: 14.5px; flex: 1; }
    .badge { font-size: 11px; color: var(--muted); background: var(--chip); border-radius: 20px; padding: 2px 9px; }
    p.tip { margin: 0 0 12px; color: var(--muted); font-size: 11.5px; }
    p.tip b { color: var(--brand); }
    input, textarea {
      width: 100%; padding: 9px 11px; margin-bottom: 8px; border: 1px solid var(--line);
      border-radius: 9px; background: transparent; color: var(--ink); font: inherit; resize: vertical;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--brand); }
    button {
      font: inherit; padding: 8px 15px; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--ink);
    }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    button:hover { filter: brightness(1.06); }
    .row { display: flex; gap: 7px; align-items: center; }
    .status { font-size: 11.5px; color: var(--brand); margin-inline-start: auto; }
    .list {
      margin-top: 13px; border-top: 1px solid var(--line); padding-top: 10px;
      max-height: 190px; overflow-y: auto;
    }
    .item {
      display: flex; gap: 8px; align-items: baseline; padding: 5px 7px;
      border-radius: 7px; unicode-bidi: plaintext;
    }
    .item:hover { background: var(--brand-soft); }
    .item b { color: var(--brand); font-weight: 600; flex: none; }
    .item span {
      color: var(--muted); flex: 1; min-width: 0; font-size: 11.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .muted { color: var(--muted); text-align: center; padding: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">//</span>
    <h1>קיצורי הקלדה</h1>
    <span class="badge" id="badge">0</span>
  </header>
  <p class="tip">הקלידו <b>//</b> בכל שדה טקסט כדי לחפש קיצור.</p>

  <form id="quick">
    <input id="title" type="text" placeholder="כותרת ללא רווחים" maxlength="40" dir="auto" required>
    <textarea id="text" rows="3" placeholder="תוכן ההודעה" dir="auto" required></textarea>
    <div class="row">
      <button type="submit" class="primary">הוספה</button>
      <button type="button" id="open">האזור האישי</button>
      <span class="status" id="status"></span>
    </div>
  </form>

  <div class="list" id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
